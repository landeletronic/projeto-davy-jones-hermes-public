<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Ilustração da tela do Tutor Tiradentes</title>
  <desc id="desc">Tela esquemática com seletor do Tutor Tiradentes, resposta, caixa de mensagem e quatro marcações numeradas.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity="0.16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#eef4fb"/>
  <rect x="110" y="55" width="980" height="590" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="110" y="55" width="980" height="70" rx="22" fill="#172033"/>
  <rect x="110" y="103" width="980" height="22" fill="#172033"/>
  <circle cx="145" cy="90" r="8" fill="#fb7185"/><circle cx="170" cy="90" r="8" fill="#fbbf24"/><circle cx="195" cy="90" r="8" fill="#4ade80"/>
  <rect x="350" y="72" width="500" height="38" rx="12" fill="#26334d" stroke="#8191ad"/>
  <text x="600" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Tutor Tiradentes — 9º ano  ▾</text>
  <rect x="150" y="160" width="640" height="74" rx="18" fill="#e8eef8"/>
  <text x="175" y="190" font-family="Arial, sans-serif" font-size="18" fill="#172033">Quero tentar a questão 26 de Matemática de 2025.</text>
  <text x="175" y="216" font-family="Arial, sans-serif" font-size="18" fill="#172033">Não mostre a resposta ainda.</text>
  <circle cx="170" cy="290" r="22" fill="#2563eb"/><text x="170" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#fff">T</text>
  <rect x="205" y="260" width="775" height="190" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="230" y="294" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">Questão confirmada</text>
  <text x="230" y="327" font-family="Arial, sans-serif" font-size="17" fill="#334155">Matemática · 2025 · questão 26</text>
  <text x="230" y="360" font-family="Arial, sans-serif" font-size="16" fill="#475569">Leia o enunciado e escolha uma estratégia.</text>
  <text x="230" y="391" font-family="Arial, sans-serif" font-size="16" fill="#475569">Documento: prova-2025.pdf · página 9</text>
  <rect x="230" y="410" width="190" height="25" rx="8" fill="#dbeafe"/><text x="325" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">Resposta ainda oculta</text>
  <rect x="160" y="530" width="810" height="70" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="573" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Escreva sua pergunta ou explique sua tentativa...</text>
  <circle cx="1030" cy="565" r="34" fill="#2563eb"/><path d="M1017 566 L1040 552 L1034 577 L1027 569 Z" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="310" cy="55" r="24" fill="#f59e0b"/><text x="310" y="63" font-size="22" fill="#172033">1</text>
    <circle cx="835" cy="178" r="24" fill="#f59e0b"/><text x="835" y="186" font-size="22" fill="#172033">2</text>
    <circle cx="120" cy="565" r="24" fill="#f59e0b"/><text x="120" y="573" font-size="22" fill="#172033">3</text>
    <circle cx="1085" cy="565" r="24" fill="#f59e0b"/><text x="1085" y="573" font-size="22" fill="#172033">4</text>
  </g>
  <path d="M310 80 L365 89" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M820 195 L775 244" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M144 565 L157 565" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1061 565 L1064 565" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Ilustração educativa: a aparência pode variar um pouco conforme o navegador.</text>
</svg>
