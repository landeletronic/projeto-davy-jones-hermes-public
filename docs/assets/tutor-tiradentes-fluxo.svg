<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo recomendado de estudo com o Tutor Tiradentes</title>
  <desc id="desc">Seis etapas ligadas por setas: escolher, tentar, pedir dica, explicar, corrigir e conferir.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="1200" height="360" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Aprender é mais importante do que apenas descobrir a letra</text>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#arrow)">
    <line x1="190" y1="175" x2="238" y2="175"/><line x1="380" y1="175" x2="428" y2="175"/>
    <line x1="570" y1="175" x2="618" y2="175"/><line x1="760" y1="175" x2="808" y2="175"/>
    <line x1="950" y1="175" x2="998" y2="175"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g><circle cx="120" cy="175" r="70" fill="#dbeafe"/><text x="120" y="166" font-size="34">🔎</text><text x="120" y="201" font-size="18" font-weight="700" fill="#1e3a8a">1. Escolher</text></g>
    <g><circle cx="310" cy="175" r="70" fill="#dcfce7"/><text x="310" y="166" font-size="34">✏️</text><text x="310" y="201" font-size="18" font-weight="700" fill="#14532d">2. Tentar</text></g>
    <g><circle cx="500" cy="175" r="70" fill="#fef3c7"/><text x="500" y="166" font-size="34">💡</text><text x="500" y="201" font-size="18" font-weight="700" fill="#713f12">3. Pedir dica</text></g>
    <g><circle cx="690" cy="175" r="70" fill="#ede9fe"/><text x="690" y="166" font-size="34">💬</text><text x="690" y="201" font-size="18" font-weight="700" fill="#4c1d95">4. Explicar</text></g>
    <g><circle cx="880" cy="175" r="70" fill="#ffe4e6"/><text x="880" y="166" font-size="34">🧭</text><text x="880" y="201" font-size="18" font-weight="700" fill="#881337">5. Corrigir</text></g>
    <g><circle cx="1070" cy="175" r="70" fill="#cffafe"/><text x="1070" y="166" font-size="34">✅</text><text x="1070" y="201" font-size="18" font-weight="700" fill="#164e63">6. Conferir</text></g>
  </g>
  <rect x="275" y="285" width="650" height="46" rx="23" fill="#172033"/>
  <text x="600" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Tentativa + explicação + conferência = aprendizagem de verdade</text>
</svg>
