# /etc/samba/smb.conf — share de documentos do lab davy-jones-hermes
#
# Versionado no repo e instalado por ops/deploy/sync-to-host.ps1.
# NÃO edite o arquivo do host à mão: o próximo deploy sobrescreve.
#
# Por que existe: os documentos de estudo (editais, provas, gabaritos) vivem no
# SERVIDOR (fonte única, entra no backup) e o Windows acessa por SMB. Nada disso
# fica no repositório (a árvore sincronizada é código).
#
# Uso: \\192.168.15.231\documentos  (usuário usuario, senha definida com smbpasswd)
# Diagnóstico: smbclient -L //localhost -U usuario   ·   testparm -s
#
# ATENÇÃO: no smb.conf comentário só vale em linha inteira — "#" depois do valor
# entra no valor ("invalid value 'SMB2_10 # ...'"). Mantenha os comentários acima.

[global]
   server string = hermes-lab documentos
   workgroup = WORKGROUP
   server min protocol = SMB2_10
   map to guest = never
   restrict anonymous = 2
   disable netbios = yes
   netbios name = hermes-lab

   # Duas camadas de restrição: o ufw libera 445 só para a sub-rede
   # (ops/bin/ufw-lab.sh) e o Samba recusa qualquer origem fora dela.
   # 127.0.0.1 entra só para diagnóstico local (smbclient no próprio host).
   hosts allow = 192.168.15.0/24 127.0.0.1
   hosts deny = 0.0.0.0/0

   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   log level = 1

[documentos]
   comment = Documentos de estudo (base do RAG)
   path = /home/usuario/documents
   valid users = usuario
   read only = no
   browseable = yes
   create mask = 0644
   directory mask = 0755
   # lixeira do Windows e afins não viram documento
   veto files = /.DS_Store/desktop.ini/Thumbs.db/
   delete veto files = yes
